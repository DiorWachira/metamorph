[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "metamorph"
version = "0.1.0"
description = "Metamorphic testing and CI gating for LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dior Wachira" }]
dependencies = [
    "typer>=0.27.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.6",
    "jsonpath-ng>=1.15.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
llm = ["anthropic>=2.3.0"]
embeddings = ["fastembed>=0.9.1"]
server = ["fastapi>=0.162.0", "uvicorn>=0.54.0"]
examples = ["fastapi>=0.162.0", "uvicorn>=0.54.0", "scikit-learn>=1.9.1"]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "hypothesis>=6.170.13",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-PyYAML",
    "metamorph[examples,llm,server]",
]

[project.scripts]
metamorph = "metamorph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/metamorph/templates.py" = ["E501"]  # JSONL seed lines

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["metamorph"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "fastembed.*"]
ignore_missing_imports = true
