# Weekly dependency updates, one grouped PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    groups:
      ui: {patterns: ["*"]}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
