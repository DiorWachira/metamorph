name: Pages

# Publishes the read-only demo of the cabinet: the real UI over a frozen snapshot of the CV demo's
# data (ui/demo/snapshot, made by ui/scripts/make_snapshot.py). There is no server behind it.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/metamorph/design/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the demo
        working-directory: ui
        env:
          VITE_SNAPSHOT: "1"
        run: |
          npm ci
          npx vite build --base=/metamorph/ --outDir="$GITHUB_WORKSPACE/site"
          cp -r demo/snapshot "$GITHUB_WORKSPACE/site/snapshot"
          # Pages serves 404.html for deep links, so the client router can take over.
          cp "$GITHUB_WORKSPACE/site/index.html" "$GITHUB_WORKSPACE/site/404.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
