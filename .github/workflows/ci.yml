name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  demo-gate:
    # Dogfood the gate: the planted-bug demo must fail with exit code 1 and the fix must pass.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: examples/rag_kenya
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e "../..[examples]"

      - name: Planted bug is caught (expects exit 1)
        run: |
          set +e
          metamorph run --gate
          code=$?
          set -e
          echo "metamorph exited with $code"
          test "$code" -eq 1

      - name: Fixed app passes (expects exit 0)
        run: RAG_FIXED=1 metamorph run --gate --no-cache

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metamorph-reports
          path: examples/rag_kenya/.metamorph/reports/
          include-hidden-files: true
