name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 and would change CI under us
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  security:
    # Known-vulnerability audit of Python and UI dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Python dependencies
        run: |
          pip install -e ".[dev,embeddings]" pip-audit
          pip-audit --skip-editable

      - name: UI dependencies
        working-directory: ui
        run: npm audit --audit-level=moderate

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo-gate:
    # Dogfood the gate: each planted-bug demo must fail with exit code 1 and its fix must pass.
    # The CV demo's LLM transforms replay recorded follow-ups, so no API key is needed.
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      matrix:
        include:
          - demo: rag_kenya
            fix: RAG_FIXED
          - demo: cv_skills
            fix: CV_FIXED
    defaults:
      run:
        working-directory: examples/${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e "../..[examples]"

      - name: Planted bug is caught (expects exit 1)
        run: |
          set +e
          metamorph run --gate
          code=$?
          set -e
          echo "metamorph exited with $code"
          test "$code" -eq 1

      - name: Fixed app passes (expects exit 0)
        run: env ${{ matrix.fix }}=1 metamorph run --gate --no-cache

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metamorph-reports-${{ matrix.demo }}
          path: examples/${{ matrix.demo }}/.metamorph/reports/
          include-hidden-files: true
