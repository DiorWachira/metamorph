# Metamorph config for the RAG demo, calling the app in-process (no server needed):
#   cd examples/rag_kenya && metamorph run --gate
# For the HTTP version see metamorph.http.yaml.

target:
  type: python
  callable: rag_app:answer
  output_path: $.answer

seeds: seeds.jsonl

fields:
  text: question
  documents: documents

relations:
  - id: doc-order-invariance
    mode: blocking
  - distractor-invariance
  - typo-robustness
  - number-format-invariance
  - entity-swap-invariance

run:
  seed: 7

gate:
  max_blocking_violations: 0
